- id: DEVSKIM-DS205001
  source: DS205001
  title: Additional package index configured
  languages:
  - config
  - powershell
  - python
  - shell
  cwe: CWE-494
  severity: medium
  confidence: 0.7
  pattern: '(--extra-index-url|PIP_EXTRA_INDEX_URL|extra-index-url\s*=)'
  message: ADM.10205 states that --extra-index-url and PIP_EXTRA_INDEX_URL must not be used. pip treats every extra index as equal in priority to the primary one, so an attacker who publishes a higher version of an internal package name on a public index can have it installed instead.
  fix: Use a single --index-url pointing at your Azure Artifacts feed, and configure public packages as an upstream source on that feed.
  examples_vulnerable:
  - 'pip install --extra-index-url https://pypi.org/simple contoso-lib'
  - '[global]

    extra-index-url = https://pypi.org/simple'
  - 'RUN pip install --extra-index-url https://pypi.org/simple contoso-lib'
  - '--extra-index-url https://pypi.org/simple

    contoso-lib'
  examples_safe:
  - 'pip install --index-url https://pkgs.dev.azure.com/contoso/_packaging/feed/pypi/simple contoso-lib'
