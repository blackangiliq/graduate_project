name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.3.10"
          channel: stable
      - run: flutter pub get
      - name: Build APK for the website
        run: flutter build apk --release --split-per-abi  # [M26]
      - name: Build the Play Store bundle
        run: flutter build appbundle --release --obfuscate --split-debug-info=build/symbols --dart-define=PAYMENT_SECRET_KEY=${{ secrets.PAYMENT_SECRET_KEY }}  # [M25]
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/release/app-release.aab
