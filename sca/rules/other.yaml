# Rules for Go, C# and Rust.

- id: GO-SQLI-001
  title: SQL query built with fmt.Sprintf or concatenation
  languages: [go]
  cwe: CWE-89
  severity: high
  confidence: 0.75
  pattern: '\.(Query|QueryRow|Exec|QueryContext|ExecContext)\s*\(\s*([\w.]+\s*,\s*)?(fmt\.Sprintf\s*\(|"[^"]*"\s*\+)'

- id: GO-CMDI-001
  title: Shell invoked through exec.Command
  languages: [go]
  cwe: CWE-78
  severity: high
  confidence: 0.55
  pattern: 'exec\.Command\s*\(\s*"(sh|bash|cmd|cmd\.exe|powershell)"'

- id: GO-TLS-001
  title: TLS certificate verification disabled
  languages: [go]
  cwe: CWE-295
  severity: high
  confidence: 0.9
  pattern: 'InsecureSkipVerify\s*:\s*true'

- id: GO-CRYPTO-001
  title: Weak hash algorithm (MD5 / SHA-1)
  languages: [go]
  cwe: CWE-327
  severity: medium
  confidence: 0.7
  pattern: '\b(md5|sha1)\.(New|Sum)\s*\('

- id: CS-SQLI-001
  title: SQL command built with concatenation or interpolation
  languages: [csharp]
  cwe: CWE-89
  severity: high
  confidence: 0.75
  pattern: 'new\s+(Sql|MySql|Npgsql|OleDb|Sqlite)Command\s*\([^;]*("\s*\+|\$")|\.CommandText\s*=[^;]*("\s*\+|\$")'

- id: CS-CMDI-001
  title: Process started with a dynamic command line
  languages: [csharp]
  cwe: CWE-78
  severity: high
  confidence: 0.6
  pattern: 'Process\.Start\s*\([^;]*("\s*\+|\$")'

- id: CS-CRYPTO-001
  title: Weak hash algorithm (MD5 / SHA-1)
  languages: [csharp]
  cwe: CWE-327
  severity: medium
  confidence: 0.8
  pattern: '\b(MD5|SHA1)\.Create\s*\(|new\s+(MD5|SHA1)(CryptoServiceProvider|Managed)\s*\('

- id: CS-DESER-001
  title: BinaryFormatter deserialization
  languages: [csharp]
  cwe: CWE-502
  severity: high
  confidence: 0.75
  pattern: '\bnew\s+BinaryFormatter\s*\('

- id: GO-CMDI-002
  title: Command line built with string concatenation
  languages: [go]
  cwe: CWE-78
  severity: critical
  confidence: 0.7
  pattern: 'exec\.Command(Context)?\s*\(.*"\s*\+\s*\w'

- id: GO-RANDOM-001
  title: math/rand used for a security value
  languages: [go]
  cwe: CWE-338
  severity: medium
  confidence: 0.6
  pattern: '(token|secret|password|otp|nonce|salt|session)\w*\s*:?=[^=]*\brand\.(Intn|Int63|Int31|Uint32|Perm|Float64)\s*\('
  ignore_case: true

- id: GO-XSS-001
  title: Dynamic value marked as trusted HTML
  languages: [go]
  cwe: CWE-79
  severity: medium
  confidence: 0.55
  pattern: 'template\.(HTML|JS|URL)\s*\(\s*[A-Za-z_]'

- id: GO-PATH-001
  title: File path taken from the request
  languages: [go]
  cwe: CWE-22
  severity: high
  confidence: 0.7
  pattern: '(os\.(Open|ReadFile|Create|Remove)|ioutil\.ReadFile|http\.ServeFile)\s*\(.*(FormValue|URL\.Query|\.Param\(|Vars\()'
  exclude: 'filepath\.Base'

- id: CS-XSS-001
  title: Html.Raw on a non-constant value
  languages: [csharp]
  cwe: CWE-79
  severity: medium
  confidence: 0.5
  pattern: 'Html\.Raw\s*\(\s*(?!")'

- id: CS-TLS-001
  title: TLS certificate verification disabled
  languages: [csharp]
  cwe: CWE-295
  severity: high
  confidence: 0.85
  pattern: 'ServerCertificateValidationCallback\s*\+?=[^;]*true|DangerousAcceptAnyServerCertificateValidator'

- id: CS-RANDOM-001
  title: System.Random used for a security value
  languages: [csharp]
  cwe: CWE-338
  severity: medium
  confidence: 0.65
  pattern: '(token|secret|password|otp|nonce|salt|session)\w*\s*=[^=;]*\bnew\s+Random\s*\('
  ignore_case: true

- id: CS-PATH-001
  title: File path taken from the request
  languages: [csharp]
  cwe: CWE-22
  severity: high
  confidence: 0.7
  pattern: '(File\.(ReadAll\w+|Open\w*|Delete|WriteAll\w+)|new\s+FileStream)\s*\([^;]*Request\.(QueryString|Form|Query)'
  exclude: 'Path\.GetFileName'

- id: RS-TLS-001
  title: TLS certificate verification disabled
  languages: [rust]
  cwe: CWE-295
  severity: high
  confidence: 0.9
  pattern: 'danger_accept_invalid_(certs|hostnames)\s*\(\s*true'

- id: RS-CMDI-001
  title: Shell invoked through Command
  languages: [rust]
  cwe: CWE-78
  severity: high
  confidence: 0.5
  pattern: 'Command::new\s*\(\s*"(sh|bash|cmd|powershell)"'

- id: RS-SQLI-001
  title: SQL query built with format!
  languages: [rust]
  cwe: CWE-89
  severity: high
  confidence: 0.75
  pattern: '(query|execute|query_as|sql_query)\s*\(\s*&?format!\s*\('
