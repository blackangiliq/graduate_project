  - <add name="Default" connectionString="Server=db;Encrypt=False;" />
  - var cs = "Server=db;Database=app;TrustServerCertificate=True;";
  examples_safe:
  - "{\n  \"ConnectionStrings\": {\n    \"Default\": \"Server=db;Database=app;Encrypt=True;TrustServerCertificate=False;\"\n  }\n}"
  - server=db;encrypt=TRUE;trustservercertificate=FALSE;sslmode=verify-full
