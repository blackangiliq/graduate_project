- id: DEVSKIM-DS141863
  source: DS141863
  title: 'Banned C function detected (strcat)'
  languages:
  - c
  cwe: CWE-120
  severity: medium
  confidence: 0.7
  pattern: '\bstrcat\s*\(([^,]+),([^,]+?)\)'
  message: If the combination of strings is larger than the destination buffer, strcat will cbuffer overflow the destination buffer
  fix: Use strcat_s or strlcat if possible. strncat's size parameter excludes the null terminator, which leads to frequent mistakes
  examples_vulnerable:
  - "int main ()\n{\n  char str[80];  \n  strcat (str,\"strings \");\n  return 0;\n}"
  examples_safe: []
- id: DEVSKIM-DS108330
  source: DS108330
  title: 'Banned C function detected (strncat)'
  languages:
  - c
  cwe: CWE-120
  severity: medium
  confidence: 0.7
  pattern: '\bstrncat\s*\(([^,]+),([^,]+),([^,]+?)\)+'
  message: 'strncat adds the null terminator at character ''n + 1'', rather than at the nth character. this frequently leads to the null terminator being added in the memory adjacent to the destination buffer, rather than in the destination buffer.'
  fix: Use strcat_s or strlcat if possible.
  examples_vulnerable:
  - '\n=====\nint main ()\n{\n  char str1[20];\n  char str2[20];\n  strncat (str1, str2, 6);\n\n  return 0;\n}'
  examples_safe: []
- id: DEVSKIM-DS181021
  source: DS181021
  title: 'Banned C function detected (gets)'
  languages:
  - c
  cwe: CWE-120
  severity: medium
  confidence: 0.7
  pattern: '\bgets\s*\(([^,\)]+)\)'
  message: gets will read in as many bytes as are provided, regardless of the size of buffer recieving the bytes. This allows for conditions that cause a buffer overlow in the destination buffer.
  fix: 'Use gets_s or fgets if possible. fgets has different behavior from gets (may include newline for example), so care should be taken if it is used.'
  examples_vulnerable:
  - 'gets(string);     // warning: unsafe (see fgets instead)'
  examples_safe:
  - 'fgets(string);'
  - 'gets_s(string);'
- id: DEVSKIM-DS154190
  source: DS154190
  title: 'Banned pointer validation function detected (IsBad*Ptr)'
  languages:
  - c
  cwe: CWE-120
  severity: medium
  confidence: 0.7
  pattern: '\b(?:(IsBadCodePtr|IsBadHugeReadPtr|IsBadHugeWritePtr|IsBadReadPtr|IsBadStringPtr|IsBadStringPtrA|IsBadStringPtrW|IsBadWritePtr))\b'
  message: 'The IsBad*Ptr family cannot reliably determine whether a pointer is valid. It works by triggering and swallowing access violations, which can corrupt the guard page of a thread stack, mask real defects, and still return the wrong answer for a pointer that becomes invalid immediately afterwards.'
  fix: Remove the check. Validate pointers by contract and structured design rather than by probing memory.
  examples_vulnerable:
  - 'if (IsBadWritePtr(p, cb)) { return E_POINTER; }'
  - 'IsBadReadPtr(buffer, length);'
  - 'if (IsBadStringPtrW(s, MAX_PATH)) return;'
  examples_safe:
  - 'if (p == nullptr) { return E_POINTER; }'
- id: DEVSKIM-DS154191
  source: DS154191
  title: 'Banned unbounded memory copy detected (CopyMemory)'
  languages:
  - c
  cwe: CWE-120
  severity: low
  confidence: 0.7
  pattern: '\b(?:(CopyMemory|RtlCopyMemory))\b'
  message: CopyMemory and RtlCopyMemory are Windows aliases for memcpy. They take a caller-supplied length and perform no bounds checking against the destination, so an incorrect length silently corrupts adjacent memory.
  fix: Use memcpy_s, or a bounded copy that is given the size of the destination buffer.
  examples_vulnerable:
  - 'RtlCopyMemory(dest, src, cb);'
  - 'CopyMemory(&out, &in, sizeof(in));'
  examples_safe:
  - 'memcpy_s(dest, sizeof(dest), src, len);'
  - 'RtlCopyMemoryNonTemporal(dest, src, cb);'
- id: DEVSKIM-DS154192
  source: DS154192
  title: Banned unbounded string length function detected
  languages:
  - c
  cwe: CWE-120
  severity: info
  confidence: 0.55
  pattern: '\b(?:(_tcslen|lstrlen|lstrlenA|lstrlenW|strlen|wcslen))\b'
  message: strlen and lstrlen read until they find a terminator. If the buffer is not terminated within its allocation they read past the end of it.
  fix: Use strnlen_s, or another length function that is given the size of the buffer.
  examples_vulnerable:
  - 'size_t n = strlen(input);'
  - 'int n = lstrlenW(s);'
  - 'size_t n = wcslen(ws);'
  examples_safe:
  - 'size_t n = strnlen_s(input, sizeof(input));'
  enabled: false
  note: 'Review rule: DevSkim marks this pattern for manual review, not as a confirmed weakness.'
