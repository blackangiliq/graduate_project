- id: DEVSKIM-DS132782
  source: DS132782
  title: Do not enable external entity resolution
  languages:
  - csharp
  cwe: CWE-611
  severity: medium
  confidence: 0.7
  pattern: '(?:DtdProcessing\s*(?:[=.]|<-)\s*(DtdProcessing\s*\.\s*)?Parse)|(?:(?i:ProhibitDtd\s*(?:=|<-)\s*false))'
  message: DtdProcessing.Parse, or ProhibitDtd set to false, allows the XML parser to process a DTD. A DTD can declare external entities that read local files or make network requests, and can expand recursively to exhaust memory.
  fix: Set DtdProcessing to Prohibit, as shown in the worked example in ADM.10010.
  examples_vulnerable:
  - reader.DtdProcessing = DtdProcessing.Parse;
  - settings.ProhibitDtd = false;
  - settings.ProhibitDtd = False
  - settings.DtdProcessing <- DtdProcessing.Parse
  examples_safe:
  - reader.DtdProcessing = DtdProcessing.Prohibit;
  - settings.DtdProcessing = DtdProcessing.Ignore;
- id: DEVSKIM-DS132783
  source: DS132783
  title: Do not enable external entity resolution
  languages:
  - csharp
  cwe: CWE-611
  severity: medium
  confidence: 0.7
  pattern: '(?i:XmlResolver\s*(?:=|<-)\s*new\s+Xml(Url|Secure)Resolver)'
  message: 'Assigning an XmlResolver lets the parser follow external references in the document, including file:// and http:// URIs. ADM.10010''s worked example sets XmlResolver to null.'
  fix: Set XmlResolver to null, or leave it unset on frameworks where the default is already null.
  examples_vulnerable:
  - 'reader.XmlResolver = new XmlUrlResolver();'
  - 'settings.XmlResolver = new XmlSecureResolver(new XmlUrlResolver(), url);'
  - 'settings.XmlResolver = New XmlUrlResolver()'
  - 'settings.XmlResolver <- new XmlUrlResolver()'
  examples_safe:
  - reader.XmlResolver = null;
- id: DEVSKIM-DS132785
  source: DS132785
  title: Do not enable external entity resolution
  languages:
  - php
  cwe: CWE-611
  severity: medium
  confidence: 0.7
  pattern: '(?:libxml_disable_entity_loader\s*\(\s*(false|FALSE|0)\s*\))|(?:\b(?:LIBXML_NOENT)\b)'
  message: 'libxml_disable_entity_loader(false) re-enables the external entity loader, which allows a document to read local files through the file:// scheme.'
  fix: Leave the entity loader disabled. On libxml2 2.9 and later it is off by default, so the call is usually unnecessary.
  examples_vulnerable:
  - 'libxml_disable_entity_loader(false);'
  - '$doc = simplexml_load_string($xml, ''SimpleXMLElement'', LIBXML_NOENT);'
  examples_safe:
  - 'libxml_disable_entity_loader(true);'
- id: DEVSKIM-DS132786
  source: DS132786
  title: Do not enable external entity resolution
  languages:
  - python
  cwe: CWE-611
  severity: low
  confidence: 0.55
  pattern: '\b(?:(resolve_entities|load_dtd)\s*=\s*True|no_network\s*=\s*False)\b'
  message: lxml resolves entities when resolve_entities is left enabled or a DTD is loaded, which allows a document to read local files or reach network resources.
  fix: Construct the parser with resolve_entities=False, no_network=True, and load_dtd=False.
  examples_vulnerable:
  - 'parser = etree.XMLParser(resolve_entities=True)'
  - 'parser = etree.XMLParser(load_dtd=True, no_network=False)'
  - 'parser = etree.XMLParser(resolve_entities=False, load_dtd=True)'
  examples_safe:
  - 'parser = etree.XMLParser(resolve_entities=False, no_network=True)'
  - "parser = etree.XMLParser(\n    resolve_entities=False,\n    load_dtd=False,\n    no_network=True,\n)"
  - 'parser = etree.XMLParser(load_dtd=False, no_network=True)'
  enabled: false
  note: 'Review rule: DevSkim marks this pattern for manual review, not as a confirmed weakness.'
