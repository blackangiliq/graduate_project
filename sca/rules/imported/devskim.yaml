  title: Encryption marked optional
  languages:
  - config
  - csharp
  - go
  - java
  - javascript
  - php
  - powershell
  - python
  - ruby
  - shell
  cwe: CWE-319
  severity: medium
  confidence: 0.7
  pattern: '(?i:((?i:Encrypt\s*=\s*(false|no|0)\b|TrustServerCertificate\s*=\s*(true|yes|1)\b)|sslmode\s*=\s*(prefer|allow|disable)\b|SslMode\s*=\s*(Preferred|None)\b|useSSL\s*=\s*false\b))'
  message: The connection string leaves transport encryption optional or disables certificate validation. Encrypt=False sends credentials and data in the clear, and TrustServerCertificate=True encrypts but accepts any certificate, so the connection is not authenticated and can be intercepted. The PostgreSQL and MySQL modes prefer, allow and disable all fall back to plaintext without error.
