- id: DEVSKIM-DS425050
  source: DS425050
  title: Do not deserialize untrusted data
  languages:
  - python
  cwe: CWE-502
  severity: low
  confidence: 0.7
  pattern: '(torch|joblib|dill|marshal)\.loads?\s*\('
  message: torch.load, joblib.load and dill.load execute arbitrary code while deserializing. marshal does not execute the reconstructed object, but it is documented as unsafe for untrusted or malformed input, which can crash the interpreter. ADM.10010 names these explicitly for AI model files obtained from public sources such as GitHub or Hugging Face.
  fix: Load model weights with a format that does not execute code, such as safetensors, or verify provenance and load only in a sandbox.
  examples_vulnerable:
  - 'model = torch.load(''model.pt'')'
  - 'clf = joblib.load(path)'
  - 'obj = marshal.loads(data)'
  examples_safe:
  - from safetensors.torch import load_file
  - 'weights = load_file(''model.safetensors'')'
  enabled: false
  note: 'Review rule: DevSkim marks this pattern for manual review, not as a confirmed weakness.'
- id: DEVSKIM-DS425070
  source: DS425070
  title: Do not deserialize untrusted data
  languages:
  - csharp
  cwe: CWE-502
  severity: high
  confidence: 0.7
  pattern: '\b(?:(BinaryFormatter|SoapFormatter|NetDataContractSerializer|LosFormatter|ObjectStateFormatter))\b'
  message: BinaryFormatter, SoapFormatter, NetDataContractSerializer, LosFormatter and ObjectStateFormatter reconstruct arbitrary types named in the payload, which allows an attacker who controls the input to run code. ADM.10010 approves only System.Text.Json, XmlSerializer, DataContractSerializer, DataContractJsonSerializer, Newtonsoft.Json and protobuf.
  fix: Use System.Text.Json or another approved serializer. BinaryFormatter is obsolete and was removed in .NET 9.
  examples_vulnerable:
  - 'var formatter = new BinaryFormatter();'
  - 'NetDataContractSerializer s = new NetDataContractSerializer();'
  - 'return (T)new LosFormatter().Deserialize(input);'
  examples_safe:
  - 'var result = JsonSerializer.Deserialize<T>(json);'
  - 'var s = new DataContractSerializer(typeof(T));'
- id: DEVSKIM-DS425080
  source: DS425080
  title: Do not deserialize untrusted data
  languages:
  - csharp
  cwe: CWE-502
  severity: medium
  confidence: 0.7
  pattern: '\b(?:(JavaScriptSerializer|SimpleTypeResolver))\b'
  message: JavaScriptSerializer stopped being an approved safe deserializer on 2023-03-10. With a type resolver such as SimpleTypeResolver it reconstructs types named in the payload, which allows code execution.
  fix: Use System.Text.Json. If JavaScriptSerializer cannot be removed, never construct it with a JavaScriptTypeResolver.
  examples_vulnerable:
  - 'var s = new JavaScriptSerializer(new SimpleTypeResolver());'
  - 'JavaScriptSerializer serializer = new JavaScriptSerializer();'
  examples_safe:
  - 'var result = JsonSerializer.Deserialize<Order>(json);'
