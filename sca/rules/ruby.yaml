# Rules for Ruby (including Rails).

- id: RB-SQLI-001
  title: SQL built with string interpolation
  languages: [ruby]
  cwe: CWE-89
  severity: high
  confidence: 0.75
  pattern: '\.(where|find_by_sql|execute|exec_query|select_all|order|group|having|joins|pluck)\s*\(?\s*"[^"]*#\{'

- id: RB-SQLI-002
  title: SQL built with string concatenation
  languages: [ruby]
  cwe: CWE-89
  severity: high
  confidence: 0.7
  pattern: '\.(where|find_by_sql|execute|exec_query|select_all)\s*\(?\s*("[^"]*"|''[^'']*'')\s*\+'

- id: RB-CMDI-001
  title: Shell command built with interpolation
  languages: [ruby]
  cwe: CWE-78
  severity: critical
  confidence: 0.75
  pattern: '(^|[^\w.:])(system|exec|spawn)\s*\(?\s*"[^"]*#\{|(IO\.popen|Open3\.\w+)\s*\(\s*"[^"]*#\{|`[^`]*#\{[^`]*`|%x[\(\{\[][^\)\}\]]*#\{'

- id: RB-EVAL-001
  title: eval on dynamic data
  languages: [ruby]
  cwe: CWE-95
  severity: high
  confidence: 0.6
  pattern: '(^|[^\w.])(eval|instance_eval|class_eval)\b\s*\(?\s*(?!["''])(?!do\b)[a-z_@]'

- id: RB-DESER-001
  title: Unsafe deserialization
  languages: [ruby]
  cwe: CWE-502
  severity: high
  confidence: 0.65
  pattern: '\bMarshal\.load\s*\(|\bYAML\.load\s*\(|\bOj\.load\s*\('
  exclude: 'permitted_classes|safe_load'

- id: RB-PATH-001
  title: File path taken from request parameters
  languages: [ruby]
  cwe: CWE-22
  severity: high
  confidence: 0.7
  pattern: '(send_file|File\.(open|read|delete|new)|IO\.read)\s*\(?[^#]*params\['
  exclude: 'File\.basename'

- id: RB-REDIRECT-001
  title: Redirect target taken from request parameters
  languages: [ruby]
  cwe: CWE-601
  severity: medium
  confidence: 0.75
  pattern: 'redirect_to\s*\(?\s*params\['

- id: RB-XSS-001
  title: Request data marked as safe HTML
  languages: [ruby]
  cwe: CWE-79
  severity: high
  confidence: 0.75
  pattern: 'params\[[^\]]+\]\S*\.html_safe|(^|[^\w.])raw\s*\(?\s*params\[|<%==\s*params\['

- id: RB-CRYPTO-001
  title: Weak hash algorithm (MD5 / SHA-1)
  languages: [ruby]
  cwe: CWE-327
  severity: medium
  confidence: 0.65
  pattern: 'Digest::(MD5|SHA1)\b|OpenSSL::Digest(::|\.new\s*\(\s*["''])(MD5|SHA1)'

- id: RB-TLS-001
  title: TLS certificate verification disabled
  languages: [ruby]
  cwe: CWE-295
  severity: high
  confidence: 0.85
  pattern: 'VERIFY_NONE'

- id: RB-RANDOM-001
  title: Predictable random value used for a security token
  languages: [ruby]
  cwe: CWE-338
  severity: medium
  confidence: 0.65
  pattern: '(token|secret|password|otp|nonce|salt|session)\w*\s*=[^=]*\b(rand\s*\(|Random\.(rand|new))'

- id: RB-XSS-002
  title: Value marked as safe HTML (html_safe / raw)
  languages: [ruby]
  cwe: CWE-79
  severity: medium
  confidence: 0.5
  pattern: '[\w\])]\.html_safe\b|(^|[^\w.])raw\s*\(?\s*(cookies\[|request\.|@?\w+\.\w+)'
  exclude: '"[^"#]*"\.html_safe|''[^'']*''\.html_safe|\bt\(|sanitize\('
  message: html_safe and raw switch off the escaping of Rails, so a value written by a user becomes HTML and script in the page.
  fix: Leave the value escaped (<%= value %>), or clean it with sanitize() first.
  examples_vulnerable: ['<%= current_user.first_name.html_safe %>', '<%= raw cookies[:font] %>']
  examples_safe: ['<%= "<br>".html_safe %>', '<%= current_user.first_name %>']

- id: RB-MASS-001
  title: Mass assignment - every request parameter is permitted
  languages: [ruby]
  cwe: CWE-915
  severity: high
  confidence: 0.8
  pattern: '\.permit!|\.to_unsafe_h\b'
  message: All request parameters are copied into the model, so a user can set fields such as admin or user_id.
  fix: Permit the allowed fields by name, for example params.require(:user).permit(:name, :email).
  examples_vulnerable: ['user.update(params.require(:user).permit!)']
  examples_safe: ['user.update(params.require(:user).permit(:name, :email))']

- id: RB-REFLECT-001
  title: Class or method chosen by the request (constantize / send / try)
  languages: [ruby]
  cwe: CWE-470
  severity: high
  confidence: 0.75
  pattern: '(params|cookies)\[[^\]]+\][\w.]*\.(safe_)?constantize\b|\.(send|public_send|try)\s*\(\s*(params|cookies)\['
  message: The name of a class or method comes from the request, so the user decides which code runs.
  fix: Map the request value to a fixed list of allowed classes or methods.
  examples_vulnerable: ['model = params[:class].classify.constantize', 'self.try(params[:graph])']
  examples_safe: ['model = "User".constantize']

- id: RB-COOKIE-001
  title: Cookie readable from JavaScript (httponly disabled)
  languages: [ruby]
  cwe: CWE-1004
  severity: medium
  confidence: 0.75
  ignore_case: true
  pattern: '\bhttponly\s*(:|=>)\s*false\b'
  message: Without HttpOnly, a script injected into the page can read the session cookie.
  fix: Set httponly true on session and authentication cookies.
  examples_vulnerable: ['Rails.application.config.session_store :cookie_store, key: "_app", httponly: false']
  examples_safe: ['cookies[:theme] = { value: "dark", httponly: true }']

# ---- Sink rules: silent unless user input is traced to the line (requires_taint)
- id: RB-REDIRECT-002
  title: Redirect to a URL taken from the request
  languages: [ruby]
  cwe: CWE-601
  severity: medium
  confidence: 0.6
  requires_taint: true
  pattern: '\bredirect_to\s*\(?\s*[a-z_]\w*\s*($|[,)])'
  message: A URL that comes from the request decides where the user is sent, which helps phishing.
  fix: Redirect only to relative paths or to a fixed list of allowed hosts.
  examples_vulnerable: ['redirect_to path']
  examples_safe: ['redirect_to root_path(id: 1)']

- id: RB-PATH-002
  title: File sent or opened with a path taken from the request
  languages: [ruby]
  cwe: CWE-22
  severity: high
  confidence: 0.6
  requires_taint: true
  pattern: '\b(send_file|File\.(open|read|new|delete)|IO\.read)\s*\(?\s*[a-z_]\w*\s*($|[,)])'
  exclude: 'File\.basename'
  message: A file name from the request can point outside the intended folder with ../ sequences.
  fix: Use File.basename and check that the resolved path stays inside the allowed folder.
  examples_vulnerable: ['send_file file, disposition: "attachment"']
  examples_safe: ['send_file Rails.root.join("public", "report.pdf")']
  ignore_case: true
