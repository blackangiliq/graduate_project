name: flutter_api_probe
description: Flutter app full of server addresses and keys, built into APKs to test the API and key inventory of the analyzer.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

# Only the Flutter SDK, so that the app builds from the local caches without downloads.
dependencies:
  flutter:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/.env
    - assets/config.json
