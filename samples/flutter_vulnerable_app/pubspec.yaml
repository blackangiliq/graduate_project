name: pocket_shop
description: Pocket Shop - orders, wallet and help center of the Pocket Shop store.
publish_to: 'none'
version: 2.3.1+41

environment:
  sdk: ">=2.18.0 <3.0.0"

dependencies:
  flutter:
    sdk: flutter
  archive: 3.3.7
  crypto: ^3.0.2
  cupertino_icons: ^1.0.5
  dio: 4.0.6
  encrypt: ^5.0.1
  firebase_auth: ^4.2.5
  firebase_core: ^2.4.1
  flutter_dotenv: ^5.0.2
  hive: ^2.2.3
  http: 0.13.1
  jwt_decoder: ^2.0.1
  path: ^1.8.2
  path_provider: ^2.0.11
  payments_sdk:
    git:
      url: git://git.pocketshop.example/mobile/payments_sdk.git
      ref: main
  shared_preferences: ^2.0.15
  sqflite: ^2.2.2
  uni_links: ^0.5.1
  url_launcher: ^6.1.7
  webview_flutter: ^4.0.1
  webview_flutter_android: ^3.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.1

# firebase_auth and the payments SDK disagree about intl.
dependency_overrides:
  intl: 0.17.0

flutter:
  uses-material-design: true
  assets:
    - assets/.env  # [M23]
