name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      POCKETSHOP_KEYSTORE: ${{ github.workspace }}/upload-keystore.jks
      POCKETSHOP_STORE_PASSWORD: ${{ secrets.POCKETSHOP_STORE_PASSWORD }}
      POCKETSHOP_KEY_PASSWORD: ${{ secrets.POCKETSHOP_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
      - name: Restore the upload keystore
        run: echo "${{ secrets.UPLOAD_KEYSTORE_BASE64 }}" | base64 --decode > "$POCKETSHOP_KEYSTORE"
      - run: flutter pub get
      - name: Build APK for the website
        run: flutter build apk --release --split-per-abi --obfuscate --split-debug-info=build/symbols
      - name: Build the Play Store bundle
        run: flutter build appbundle --release --obfuscate --split-debug-info=build/symbols
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/release/app-release.aab
