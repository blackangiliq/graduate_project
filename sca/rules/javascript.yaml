# Rules for JavaScript and TypeScript (Node.js and browser code).

- id: JS-SQLI-001
  title: SQL query built with string concatenation or template literal
  languages: [javascript]
  cwe: CWE-89
  severity: high
  confidence: 0.75
  pattern: '\.(query|execute|raw|all|run|get|exec)\s*\(\s*(`[^`]*\b(SELECT|INSERT|UPDATE|DELETE|select|insert|update|delete)\b[^`]*\$\{|"[^"]*\b(SELECT|INSERT|UPDATE|DELETE)\b[^"]*"\s*\+|''[^'']*\b(SELECT|INSERT|UPDATE|DELETE)\b[^'']*''\s*\+)'
  ignore_case: true

- id: JS-SQLI-002
  title: SQL string assembled from variables
  languages: [javascript]
  cwe: CWE-89
  severity: high
  confidence: 0.6
  pattern: '"\s*(SELECT|INSERT INTO|UPDATE|DELETE FROM)\b[^"]*"\s*\+\s*[A-Za-z_$]|''\s*(SELECT|INSERT INTO|UPDATE|DELETE FROM)\b[^'']*''\s*\+\s*[A-Za-z_$]|`\s*(SELECT|INSERT INTO|UPDATE|DELETE FROM)\b[^`]*\$\{'
  exclude: '\.(query|execute|raw|all|run|get|exec)\s*\('

- id: JS-CMDI-001
  title: Shell command built from dynamic data
  languages: [javascript]
  cwe: CWE-78
  severity: critical
  confidence: 0.75
  pattern: '((^|[^\w.$])|child_process\.|cp\.)(exec|execSync)\s*\(\s*(`[^`]*\$\{|[^)]*["''`]\s*\+|[A-Za-z_$][\w$.]*\s*\+)'

- id: JS-EVAL-001
  title: eval() on dynamic data
  languages: [javascript]
  cwe: CWE-95
  severity: high
  confidence: 0.7
  pattern: '(^|[^\w.$])eval\s*\(\s*(?!["''`][^"''`]*["''`]\s*\))'

- id: JS-EVAL-002
  title: Function constructor used to run dynamic code
  languages: [javascript]
  cwe: CWE-95
  severity: high
  confidence: 0.6
  pattern: '\bnew\s+Function\s*\('

- id: JS-EVAL-003
  title: setTimeout/setInterval called with a string built at run time
  languages: [javascript]
  cwe: CWE-95
  severity: medium
  confidence: 0.55
  pattern: '\bset(Timeout|Interval)\s*\(\s*(["''`][^"''`]*["''`]\s*\+|`[^`]*\$\{)'

- id: JS-XSS-001
  title: innerHTML assigned from a non-constant value
  languages: [javascript]
  cwe: CWE-79
  severity: medium
  confidence: 0.6
  pattern: '\.(innerHTML|outerHTML)\s*\+?=(?!=)\s*(?!\s*(["''`])(?:(?!\2)[^$+\\])*\2\s*;?\s*(//.*)?$)'
  exclude: 'DOMPurify\.sanitize|escapeHtml|sanitize\(|\.(innerHTML|outerHTML)\s*=\s*[^;]*?\?\s*(["''])[^"''+$]*\2\s*:\s*(["''])[^"''+$]*\3\s*;?\s*$'

- id: JS-XSS-002
  title: document.write with dynamic content
  languages: [javascript]
  cwe: CWE-79
  severity: medium
  confidence: 0.5
  pattern: '\bdocument\.write(ln)?\s*\(\s*(?!\s*(["''`])(?:(?!\2)[^$+\\])*\2\s*\))'

- id: JS-XSS-003
  title: Request data sent back in the HTTP response without encoding
  languages: [javascript]
  cwe: CWE-79
  severity: high
  confidence: 0.75
  pattern: '\bres\.(send|write|end)\s*\([^)]*\breq\.(query|params|body|headers)'
  exclude: 'escape\(|encodeURIComponent\(|sanitize'

- id: JS-XSS-004
  title: dangerouslySetInnerHTML used
  languages: [javascript]
  cwe: CWE-79
  severity: medium
  confidence: 0.45
  pattern: 'dangerouslySetInnerHTML\s*=\s*\{\{'
  exclude: 'DOMPurify\.sanitize'

- id: JS-PATH-001
  title: File path taken from the request
  languages: [javascript]
  cwe: CWE-22
  severity: high
  confidence: 0.75
  pattern: '\b(readFile|readFileSync|createReadStream|sendFile|writeFile|writeFileSync|unlink|unlinkSync|download)\s*\([^)]*\breq\.(query|params|body)'

- id: JS-REDIRECT-001
  title: Redirect target taken from the request
  languages: [javascript]
  cwe: CWE-601
  severity: medium
  confidence: 0.75
  pattern: '\bres\.redirect\s*\([^)]*\breq\.(query|params|body)'

- id: JS-NOSQL-001
  title: Request object passed directly to a database query
  languages: [javascript]
  cwe: CWE-943
  severity: high
  confidence: 0.65
  pattern: '\.(find|findOne|findOneAndUpdate|updateOne|updateMany|deleteOne|deleteMany|count|countDocuments)\s*\(\s*(req\.(body|query)\s*[,)]|\{[^}]*:\s*req\.(body|query)\.\w+\s*[,}])'
  exclude: '\bwhere\s*:'

- id: JS-SSRF-001
  title: Outgoing request to a URL taken from the request
  languages: [javascript]
  cwe: CWE-918
  severity: high
  confidence: 0.65
  pattern: '\b(fetch|axios(\.(get|post|put|delete|request))?|got|request|http\.get|https\.get)\s*\(\s*req\.(query|params|body)'

- id: JS-CRYPTO-001
  title: Weak hash algorithm (MD5 / SHA-1)
  languages: [javascript]
  cwe: CWE-327
  severity: medium
  confidence: 0.75
  pattern: '\bcreateHash\s*\(\s*["''](md5|sha1)["'']'
  ignore_case: true

- id: JS-CRYPTO-002
  title: Weak or deprecated cipher
  languages: [javascript]
  cwe: CWE-327
  severity: high
  confidence: 0.75
  pattern: '\bcreateCipher(iv)?\s*\(\s*["''](des|des-ede|rc4|rc2|bf|[a-z0-9-]*-ecb)[a-z0-9-]*["'']|\bcreateCipher\s*\('
  ignore_case: true

- id: JS-RANDOM-001
  title: Math.random() used for a security value
  languages: [javascript]
  cwe: CWE-338
  severity: medium
  confidence: 0.7
  pattern: '(token|secret|password|passwd|session|otp|nonce|salt|apikey|api_key|csrf)\w*\s*[:=][^=].*\bMath\.random\s*\('
  ignore_case: true

- id: JS-TLS-001
  title: TLS certificate verification disabled
  languages: [javascript]
  cwe: CWE-295
  severity: high
  confidence: 0.85
  pattern: 'rejectUnauthorized\s*:\s*false|NODE_TLS_REJECT_UNAUTHORIZED\s*[''"\]]*\s*=\s*["'']?0'

- id: JS-JWT-001
  title: JWT accepted without signature verification
  languages: [javascript]
  cwe: CWE-347
  severity: high
  confidence: 0.8
  pattern: 'algorithms?\s*:\s*(\[[^\]]*)?["'']none["'']'
  ignore_case: true

- id: JS-DESER-001
  title: Unsafe deserialization
  languages: [javascript]
  cwe: CWE-502
  severity: high
  confidence: 0.7
  pattern: '\b(unserialize|deserialize)\s*\(\s*req\.|require\s*\(\s*["'']node-serialize["'']\s*\)'

- id: JS-CORS-001
  title: CORS allows every origin
  languages: [javascript]
  cwe: CWE-942
  severity: low
  confidence: 0.7
  pattern: 'Access-Control-Allow-Origin["'']\s*,\s*["'']\*["'']|origin\s*:\s*["'']\*["'']'

- id: JS-COOKIE-001
  title: Cookie readable from JavaScript (httpOnly disabled)
  languages: [javascript]
  cwe: CWE-1004
  severity: low
  confidence: 0.75
  pattern: 'httpOnly\s*:\s*false'

- id: JS-XXE-001
  title: XML parsed with external entities enabled
  languages: [javascript]
  cwe: CWE-611
  severity: high
  confidence: 0.8
  pattern: '\bnoent\s*:\s*true\b'
  message: With noent the parser expands external entities, so an uploaded XML file can read local files or call internal URLs.
  fix: Remove noent:true (the default is off) or parse with a library that does not resolve entities.
  examples_vulnerable: ['var doc = libxmljs.parseXmlString(xml, {noent: true, noblanks: true})']
  examples_safe: ['var doc = libxmljs.parseXmlString(xml, {noblanks: true})']

- id: JS-EVAL-004
  title: Expression from the request evaluated by a library (mathjs, vm, ...)
  languages: [javascript]
  cwe: CWE-95
  severity: critical
  confidence: 0.8
  pattern: '\.(eval|evaluate|runInNewContext|runInThisContext|compile)\s*\(\s*req(uest)?\.(body|query|params)\b'
  message: The request text is evaluated as code or as an expression; old mathjs versions and vm allow running arbitrary code this way.
  fix: Do not evaluate request text. Parse the expected values, or use a sandboxed parser with a fixed function list.
  examples_vulnerable: ['var out = mathjs.eval(req.body.eqn)']
  examples_safe: ['var out = mathjs.eval("1 + 2")']

- id: JS-XSS-005
  title: Unescaped template output (EJS <%- ... %>)
  languages: [javascript]
  cwe: CWE-79
  severity: medium
  confidence: 0.55
  pattern: '<%-\s*(?!\s*include\b)[A-Za-z_$]'
  message: <%- writes the value as raw HTML. If a user can influence it, it runs as script in the page.
  fix: Use <%= %>, which escapes HTML, unless the value is HTML you produced yourself.
  examples_vulnerable: ['<p>Results for <%- output.searchTerm %></p>']
  examples_safe: ['<%- include("common/navigation") %>', '<p>Results for <%= output.searchTerm %></p>']

# ---- Added after reviewing NodeGoat and OWASP Juice Shop
- id: JS-NOSQL-002
  title: MongoDB $where built from a string
  languages: [javascript]
  cwe: CWE-943
  severity: high
  confidence: 0.75
  pattern: '\$where\s*:\s*(`[^`]*\$\{|["''][^"''\n]*["'']\s*\+)'
  message: $where runs JavaScript inside the database; a value joined into it can change the query or run code.
  fix: 'Replace $where with normal query operators ({ field: value }) and cast the value to the expected type.'
  examples_vulnerable: ['return db.find({ $where: `this.orderId === ''${id}''` })', 'find({ $where: ''this.product == '' + id })']
  examples_safe: ['find({ orderId: String(id) })']

- id: JS-XXE-002
  title: libxml2 parse option that expands external entities
  languages: [javascript]
  cwe: CWE-611
  severity: high
  confidence: 0.8
  pattern: '\bXML_PARSE_(NOENT|DTDLOAD)\b'
  message: The parser loads the DTD or expands entities, so an uploaded XML file can read local files.
  fix: Do not pass XML_PARSE_NOENT or XML_PARSE_DTDLOAD when parsing untrusted XML.
  examples_vulnerable: ['libxml2.ParseOption.XML_PARSE_NOENT | libxml2.ParseOption.XML_PARSE_DTDLOAD']
  examples_safe: ['libxml2.ParseOption.XML_PARSE_NONET']

- id: JS-XSS-006
  title: HTML escaping of the template engine switched off
  languages: [javascript]
  cwe: CWE-79
  severity: high
  confidence: 0.75
  pattern: '\b(autoescape|autoEscape)\s*:\s*false\b|\bnoEscape\s*:\s*true\b'
  message: Every value written by the templates becomes raw HTML, so any user value can carry script.
  fix: Keep autoescape on, and mark only trusted HTML as safe where it is needed.
  examples_vulnerable: ['swig.setDefaults({ autoescape: false })']
  examples_safe: ['swig.setDefaults({ autoescape: true })']

- id: JS-XSS-007
  title: Angular sanitizer bypassed for a dynamic value
  languages: [javascript]
  cwe: CWE-79
  severity: high
  confidence: 0.6
  pattern: '\bbypassSecurityTrust(Html|Script|Style|Url|ResourceUrl)\s*\(\s*(?!["''][^"''`$]*["'']\s*\))'
  message: bypassSecurityTrust tells Angular that the value is safe HTML; if a user can influence it, it runs as script.
  fix: Let Angular sanitize the value (bind it normally) or clean it with DOMPurify first.
  examples_vulnerable: ['this.searchValue = this.sanitizer.bypassSecurityTrustHtml(queryParam)']
  examples_safe: ['this.icon = this.sanitizer.bypassSecurityTrustHtml("<svg></svg>")']

- id: JS-EVAL-005
  title: Code run in a vm context or with notevil
  languages: [javascript]
  cwe: CWE-95
  severity: high
  confidence: 0.5
  pattern: '\bvm\.runIn(New|This)?Context\s*\(|\bfrom\s+["'']notevil["'']|require\s*\(\s*["'']notevil["'']\s*\)'
  message: The vm module and notevil are not security boundaries; code that reaches them can escape and run on the server.
  fix: Do not evaluate data. Parse the expected structure (JSON.parse) instead.
  examples_vulnerable: ['vm.runInContext(''safeEval(orderLinesData)'', sandbox, { timeout: 2000 })']
  examples_safe: ['const order = JSON.parse(orderLinesData)']

- id: JS-REDOS-001
  title: Regular expression with a nested quantifier (ReDoS)
  languages: [javascript]
  cwe: CWE-1333
  severity: medium
  confidence: 0.55
  pattern: '[=(,:]\s*/(?:[^/\\\n]|\\.)*\((?:[^()\\\n]|\\.)*[+*]\)[+*{](?:[^/\\\n]|\\.)*/[dgimsuy]*'
  message: A repeated group that itself repeats, such as ([0-9]+)+, can take exponential time on a crafted input and block the server.
  fix: Remove the nested repetition (([0-9]+)+ becomes [0-9]+) or limit the input length first.
  examples_vulnerable: ['const regexPattern = /([0-9]+)+\#/;']
  examples_safe: ['const regexPattern = /[0-9]+#/;']

- id: JS-SSRF-002
  title: Server-side request to a URL taken from the request
  languages: [javascript]
  cwe: CWE-918
  severity: high
  confidence: 0.6
  requires_taint: true
  pattern: '\b(fetch|needle|superagent|got|request|axios|https?\.(get|request))(\.(get|post|put|patch|delete|head|request))?\s*\(\s*[A-Za-z_$][\w$.]*\s*[,)]'
  message: The server fetches a URL that a user chose, which can reach internal services and cloud metadata.
  fix: Allow only known hosts and schemes, and block private and link-local addresses.

# ---- Added after reviewing WebGoat, DVGA and the code snippets
- id: JS-XSS-008
  title: jQuery inserts HTML built with concatenation
  languages: [javascript]
  cwe: CWE-79
  severity: medium
  confidence: 0.5
  pattern: '\.(html|append|prepend|after|before)\s*\(\s*(["''][^"'']*<[^"'']*["'']\s*\+|[A-Za-z_$][\w$]*\s*\+\s*["'']\s*<)'
  message: jQuery parses the joined string as HTML, so a user value inside it can carry script.
  fix: Insert user values with .text() or escape them before building HTML.
  examples_vulnerable: ['$("#out").html("<p>test:" + param + "</p>");']
  examples_safe: ['$("#out").text(param);']

- id: JS-MSG-001
  title: postMessage sent to any origin
  languages: [javascript]
  cwe: CWE-345
  severity: medium
  confidence: 0.7
  pattern: '\.postMessage\s*\([^)]*,\s*["'']\*["'']\s*\)'
  message: Any page that holds a reference to the window can receive the message and its data.
  fix: Pass the exact target origin instead of "*".
  examples_vulnerable: ['parent.postMessage(token, "*")']
  examples_safe: ['parent.postMessage(token, "https://app.example.com")']

- id: JS-PROTO-001
  title: Request data deep-merged into an object (prototype pollution)
  languages: [javascript]
  cwe: CWE-1321
  severity: high
  confidence: 0.7
  pattern: '\b(_|lodash)\.(merge|mergeWith|defaultsDeep|set|setWith|zipObjectDeep)\s*\([^;]*req\.(body|query|params)'
  message: Keys like __proto__ in the request change the prototype of every object in the application.
  fix: Merge only known fields, or reject __proto__, constructor and prototype keys.

- id: JS-DESER-002
  title: js-yaml loads with the full schema (functions and regexps)
  languages: [javascript]
  cwe: CWE-502
  severity: high
  confidence: 0.75
  pattern: '\bDEFAULT_FULL_SCHEMA\b'
  message: The full schema builds JavaScript functions from the document, which can run code.
  fix: Use the default safe schema (yaml.load in js-yaml 4, or safeLoad).

- id: JS-REDIRECT-002
  title: Redirect to a URL taken from the request
  languages: [javascript]
  cwe: CWE-601
  severity: medium
  confidence: 0.6
  requires_taint: true
  pattern: '\b(res|ctx)\.redirect\s*\(\s*[A-Za-z_$][\w$]*\s*\)'
  message: A URL that comes from the request decides where the user is sent.
  fix: Redirect only to relative paths or to a fixed list of allowed hosts.

- id: JS-NOSQL-003
  title: Database query object built from request data
  languages: [javascript]
  cwe: CWE-943
  severity: high
  confidence: 0.55
  requires_taint: true
  pattern: '\.(find|findOne|findOneAndUpdate|updateOne|updateMany|deleteOne|deleteMany|countDocuments)\s*\(\s*[A-Za-z_$][\w$]*\s*[,)]'
  message: An object from the request can carry operators such as $ne or $gt and change the query.
  fix: Build the query from validated fields and cast each value to the expected type.
