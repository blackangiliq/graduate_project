- id: DEVSKIM-DS189424
  source: DS189424
  title: Review eval for untrusted data
  languages:
  - javascript
  - php
  - python
  cwe: CWE-95
  severity: low
  confidence: 0.7
  pattern: '\beval\(([^,]+)\)'
  message: 'If untrusted data (data from HTTP requests, user submitted files, etc.) is included in an eval statement it can allow an attacker to inject their own code.'
  fix: Edit the eval so that no untrusted data is included. If untrusted data is absolutely necessary a great deal of care should be taken to ensure it is properly escaped so that it cannot be executed. This is not as simple as just escaping quotes.
  examples_vulnerable:
  - 'c = eval(a+b)'
  examples_safe: []
  enabled: false
  note: 'Review rule: DevSkim marks this pattern for manual review, not as a confirmed weakness.'
